name: native-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: windows-x64
            runner: windows-2022
    env:
      HOSTDECK_NATIVE_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version: 22.22.2
          package-manager-cache: false
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run native checks
        run: >-
          node scripts/run-native-ci.mjs
          --target "${{ matrix.target }}"
          --output "${{ runner.temp }}/hostdeck-native-ci/${{ matrix.target }}.json"
      - name: Verify sanitized evidence
        run: >-
          node scripts/native-ci-evidence.mjs verify
          "${{ runner.temp }}/hostdeck-native-ci/${{ matrix.target }}.json"
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hostdeck-native-ci-${{ matrix.target }}
          path: ${{ runner.temp }}/hostdeck-native-ci
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 9
          overwrite: false
          retention-days: 14
